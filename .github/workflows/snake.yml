name: Generate arcade contribution graphs

on:
  # Run every 24h
  schedule:
    - cron: "0 0 * * *"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 🐍 SNAKE
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-snake-cyan.svg?color_snake=#0EA5E9&color_dots=#0F172A,#1E3A8A,#3B82F6,#7DD3FC,#E0F2FE

      # 👾 PACMAN + BREAKOUT + GALAGA + PUZZLE-BOBBLE
      - name: Generate pacman + other arcade SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,breakout,galaga,puzzle-bobble'

      # 📤 Push every SVG in dist/ to the `output` branch
      - name: Push generated SVGs to the `output` branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
